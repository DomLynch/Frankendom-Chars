name: Pitborn L8 Kontext reference

on:
  push:
    branches: [pitborn-l2-l10]
    paths:
      - ".github/workflows/pitborn-l8-kontext.yml"
      - "scripts/pitborn/kontext_l8.py"
      - "scripts/pitborn/render_source_reference.py"
      - "characters/pitborn/prompts/L8-kontext-v2.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitborn-l2-l10

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install headless Blender and Kontext client
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 xvfb mesa-utils
          python -m pip install "bpy==5.2.2" "gradio_client>=2.0.0"

      - name: Fetch immutable shipped Pitborn
        run: |
          mkdir -p work/pitborn
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/DomLynch/RPG-game/codex/01a09a76/task-1/src/assets/pitborn.glb" \
            -o work/pitborn/pitborn.glb
          echo "f202ebf6d119c08f37259965d1e34f4d5debc253631a765834693286461de86a  work/pitborn/pitborn.glb" | sha256sum -c -

      - name: Render exact Pitborn source reference
        run: |
          mkdir -p characters/pitborn/generated/donor
          mkdir -p characters/pitborn/generated/reports
          xvfb-run -a python scripts/pitborn/render_source_reference.py \
            --source work/pitborn/pitborn.glb \
            --out characters/pitborn/generated/donor/Pitborn-source-exact.png \
            --report characters/pitborn/generated/reports/source-reference.json

      - name: Generate L8 v2 reconstruction reference
        run: |
          python scripts/pitborn/kontext_l8.py \
            --image characters/pitborn/generated/donor/Pitborn-source-exact.png \
            --prompt characters/pitborn/prompts/L8-kontext-v2.txt \
            --out characters/pitborn/generated/donor/L8-reference-v2.png \
            --seed 290927 \
            --guidance 3.2 \
            --steps 30

      - uses: actions/upload-artifact@v4
        with:
          name: pitborn-L8-kontext-v2
          path: |
            characters/pitborn/generated/donor/Pitborn-source-exact.png
            characters/pitborn/generated/donor/L8-reference-v2.png
            characters/pitborn/generated/donor/L8-reference-v2.kontext.json
            characters/pitborn/generated/reports/source-reference.json
          retention-days: 30

      - name: Commit source/reference evidence
        run: |
          git config user.name "Frankendom Character Builder"
          git config user.email "actions@users.noreply.github.com"
          git add characters/pitborn/generated/donor/Pitborn-source-exact.png
          git add characters/pitborn/generated/donor/L8-reference-v2.png
          git add characters/pitborn/generated/donor/L8-reference-v2.kontext.json
          git add characters/pitborn/generated/reports/source-reference.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate Pitborn L8 Kontext v2 reference [skip ci]"
            git push origin HEAD:pitborn-l2-l10
          fi
