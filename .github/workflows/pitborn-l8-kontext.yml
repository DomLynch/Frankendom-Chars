name: Pitborn L8 Kontext reference

on:
  push:
    branches: [pitborn-l2-l10]
    paths:
      - ".github/workflows/pitborn-l8-kontext.yml"
      - "scripts/pitborn/kontext_l8.py"
      - "characters/pitborn/prompts/L8-kontext.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitborn-l2-l10
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "gradio_client>=2.0.0"
      - name: Fetch current Pitborn reference
        run: |
          mkdir -p work/pitborn
          curl -fL --retry 3 "https://raw.githubusercontent.com/DomLynch/RPG-game/codex/01a09a76/task-1/public/game/img/pitborn.webp" -o work/pitborn/pitborn.webp
      - name: Generate L8 reconstruction reference
        run: |
          python scripts/pitborn/kontext_l8.py \
            --image work/pitborn/pitborn.webp \
            --prompt characters/pitborn/prompts/L8-kontext.txt \
            --out characters/pitborn/generated/donor/L8-reference.png
      - uses: actions/upload-artifact@v4
        with:
          name: pitborn-L8-kontext
          path: characters/pitborn/generated/donor/
          retention-days: 30
      - name: Commit reference and receipt
        run: |
          git config user.name "Frankendom Character Builder"
          git config user.email "actions@users.noreply.github.com"
          git add characters/pitborn/generated/donor
          if ! git diff --cached --quiet; then
            git commit -m "Generate Pitborn L8 Kontext reference [skip ci]"
            git push origin HEAD:pitborn-l2-l10
          fi
