name: Pitborn L8 pilot

on:
  push:
    branches: [pitborn-l2-l10]
    paths:
      - ".github/workflows/pitborn-l8.yml"
      - "scripts/pitborn/build_l8.py"
      - "scripts/pitborn/validate_l8.py"
      - "characters/pitborn/source-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-l8:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pitborn-l2-l10

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install headless graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 xvfb mesa-utils

      - name: Install Blender Python and validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bpy==5.2.2" "pygltflib>=1.16.5"

      - name: Fetch immutable Pitborn source
        run: |
          mkdir -p work/pitborn
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/DomLynch/RPG-game/codex/01a09a76/task-1/src/assets/pitborn.glb" \
            -o work/pitborn/pitborn.glb
          echo "f202ebf6d119c08f37259965d1e34f4d5debc253631a765834693286461de86a  work/pitborn/pitborn.glb" | sha256sum -c -

      - name: Build L8 pilot
        run: |
          mkdir -p characters/pitborn/generated/models
          mkdir -p characters/pitborn/generated/source
          mkdir -p characters/pitborn/generated/previews
          mkdir -p characters/pitborn/generated/reports
          xvfb-run -a python scripts/pitborn/build_l8.py \
            --source work/pitborn/pitborn.glb \
            --out characters/pitborn/generated/models/pitborn-L8.glb \
            --blend characters/pitborn/generated/source/pitborn-L8.blend \
            --previews characters/pitborn/generated/previews \
            --report characters/pitborn/generated/reports/L8-build.json

      - name: Validate rig and animation preservation
        run: |
          python scripts/pitborn/validate_l8.py \
            --source work/pitborn/pitborn.glb \
            --candidate characters/pitborn/generated/models/pitborn-L8.glb \
            --out characters/pitborn/generated/reports/L8-validation.json

      - name: Generate checksums
        run: |
          cd characters/pitborn/generated
          find models source previews reports -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: pitborn-L8-pilot
          path: characters/pitborn/generated/
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated pilot evidence
        run: |
          git config user.name "Frankendom Character Builder"
          git config user.email "actions@users.noreply.github.com"
          git add characters/pitborn/generated
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build Pitborn L8 pilot [skip ci]"
            git push origin HEAD:pitborn-l2-l10
          fi
